name: macOS HQ source artifact
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout exact candidate
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --no-tags --depth 1 origin "$SOURCE"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Cross-build the Darwin target
        id: build
        run: |
          archive="$RUNNER_TEMP/hq-darwin.tar"
          bash scripts/ci-build-darwin-artifact.sh "$GITHUB_SHA" "$archive"
          digest="$(sha256sum "$archive")"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
  native:
    name: ${{ matrix.check }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: native, runner: macos-15, major: '15' }
          - { check: native macOS 27 launchd, runner: xcode-27, major: '27' }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact candidate
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --no-tags --depth 1 origin "$SOURCE"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Build and run the matching tar as the macOS role account
        env:
          LINUX_BUILT_SHA256: ${{ needs.linux.outputs.sha256 }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          EXPECTED_MACOS_MAJOR: ${{ matrix.major }}
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          gtar --version | head -1
          product="$(sw_vers -productVersion)"
          build="$(sw_vers -buildVersion)"
          arch="$(uname -m)"
          printf 'macOS %s (%s), %s\n' "$product" "$build" "$arch"
          [[ "${product%%.*}" == "$EXPECTED_MACOS_MAJOR" && "$build" =~ ^[0-9]+[A-Z][0-9]+[a-z]?$ && "$arch" == arm64 ]] || exit 1
          node --version
          archive="$RUNNER_TEMP/hq-darwin.tar"
          bash scripts/ci-build-darwin-artifact.sh "$GITHUB_SHA" "$archive"
          printf '%s  %s\n' "$LINUX_BUILT_SHA256" "$archive" | shasum -a 256 --check
          if [[ "$EXPECTED_MACOS_MAJOR" == 27 ]]; then
            bash tests/darwin-artifact-service-account.sh "$archive" --launchd-only
          else
            xcrun swiftc scripts/check-macos-enclave.swift -o "$RUNNER_TEMP/hq-enclave-check"
            bash tests/darwin-artifact-service-account.sh "$archive" "$RUNNER_TEMP/hq-enclave-check"
          fi
          printf '%s  hq-darwin.tar\n' "$LINUX_BUILT_SHA256" > "$archive.sha256"
      - name: Retain the verified Darwin tar for release review
        if: github.repository == 'true-line/agent-bot-hq' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && matrix.major == '15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hq-darwin-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hq-darwin.tar
            ${{ runner.temp }}/hq-darwin.tar.sha256
          if-no-files-found: error
