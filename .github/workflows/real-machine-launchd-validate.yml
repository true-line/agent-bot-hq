name: Real Machine and HQ launchd integration
on:
  push:
    branches: [codex/validate-machine-hq-launchd]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: true-line/agent-bot-machine
          ref: bfb9d78595a4fa2c0f601a49b72537278f174cbe
          path: machine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: true-line/agent-bot-machine
          ref: dca5218e0e73b89b43d87486da0641977fc3a53d
          path: approver
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: true-line/agent-bot-identity
          ref: 2a6edfe6f52733a7c83bddb738fc3eb420ad41b3
          path: identity
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: machine/go.mod
          cache: false
      - name: Install and reapply verified Darwin artifacts through Machine
        shell: bash
        run: bash validation/tests/real-machine-launchd-ci.sh
